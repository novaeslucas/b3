<style>
/* Moldura de navegação no estilo "terminal de mesa": menu lateral fixo à esquerda e faixa de leitura fixa no rodapé.
   Serve aos dashboards (variáveis --surface/--border) e à página inicial (--card/--line). */
.v2-lado, .v2-faixa {
  --l-sup: var(--surface, var(--card)); --l-sup2: var(--surface-2, var(--card-2)); --l-borda: var(--border, var(--line));
  font: 13.5px/1.3 "Roboto", "Inter", "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, sans-serif;
  box-sizing: border-box;
}
.v2-lado *, .v2-faixa * { box-sizing: border-box; }
body { padding-left: 212px; padding-bottom: 32px; }
html.v2-rec body { padding-left: 56px; }
.v2-lado {
  position: fixed; inset: 0 auto 32px 0; width: 212px; z-index: 30; display: flex; flex-direction: column;
  background: var(--bg); border-right: 1px solid var(--l-borda); padding: 16px 10px 12px 0; overflow: hidden auto; scrollbar-width: none;
}
.v2-marca { display: flex; align-items: center; gap: 9px; padding: 2px 10px 18px 16px; color: var(--text); font-size: 19px; font-weight: 700; letter-spacing: -.02em; text-decoration: none; white-space: nowrap; }
.v2-marca:hover { text-decoration: none; }
.v2-marca svg { flex: none; }
.v2-marca small { font-size: 10.5px; font-weight: 500; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); align-self: flex-end; padding-bottom: 3px; }
.v2-nav { display: flex; flex-direction: column; }
.v2-nav a, .v2-rec-btn {
  display: flex; align-items: center; gap: 11px; min-height: 40px; padding: 8px 10px 8px 13px; border: 0; border-left: 3px solid transparent;
  background: none; color: var(--muted); font: inherit; text-align: left; text-decoration: none; white-space: nowrap; cursor: pointer;
  transition: color .12s, background-color .12s;
}
.v2-nav a svg, .v2-rec-btn svg { flex: none; width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.v2-nav a:hover, .v2-rec-btn:hover { color: var(--text); background: var(--l-sup); text-decoration: none; }
.v2-nav a.on { color: var(--text); font-weight: 500; border-left-color: var(--text); }
.v2-nav a:focus-visible, .v2-rec-btn:focus-visible, .v2-caixa a:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.v2-sep { height: 1px; background: var(--l-borda); margin: 8px 0 8px 16px; }
.v2-rec-btn { width: 100%; color: var(--text); font-weight: 500; }
.v2-caixa { margin: 14px 0 0 16px; padding: 10px; background: var(--l-sup); border: 1px solid var(--l-borda); border-radius: 2px; color: var(--text); line-height: 1.4; white-space: normal; }
.v2-caixa a { display: block; margin-top: 9px; padding: 7px 10px; background: var(--text); color: var(--bg); border-radius: 2px; font-weight: 600; text-align: center; text-decoration: none; }
.v2-caixa a:hover { background: var(--text-2); text-decoration: none; }
.v2-fim { margin-top: auto; }
html.v2-rec .v2-lado { width: 56px; padding-right: 0; }
html.v2-rec .v2-marca { padding-left: 17px; }
html.v2-rec :is(.v2-marca span, .v2-marca small, .v2-nav a span, .v2-rec-btn span, .v2-caixa) { display: none; }
html.v2-rec :is(.v2-nav a, .v2-rec-btn) { padding-left: 17px; }
html.v2-rec .v2-rec-btn svg { transform: scaleX(-1); }
html.v2-rec .v2-sep { margin-left: 0; }

.v2-faixa {
  position: fixed; inset: auto 0 0 0; height: 32px; z-index: 31; display: flex; align-items: center; gap: 8px; padding: 0 14px;
  background: var(--l-sup2); border-top: 1px solid var(--l-borda); color: var(--text); white-space: nowrap; overflow: hidden;
}
.v2-faixa svg { flex: none; width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.6; }
.v2-faixa b { font-weight: 600; flex: none; }
.v2-faixa span { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.v2-faixa i { font-style: normal; color: var(--muted); padding: 0 7px; }
.v2-faixa .pos { color: var(--pos-txt, var(--pos)); } .v2-faixa .neg { color: var(--neg-txt, var(--neg)); }

@media (max-width: 900px) {
  body, html.v2-rec body { padding-left: 0; }
  .v2-lado, html.v2-rec .v2-lado {
    position: static; width: auto; flex-direction: row; align-items: stretch; padding: 0; border-right: 0; border-bottom: 1px solid var(--l-borda);
    overflow: auto hidden;
  }
  .v2-marca, html.v2-rec .v2-marca { padding: 8px 6px 8px 12px; font-size: 16px; }
  .v2-marca small, .v2-fim, .v2-sep { display: none; }
  html.v2-rec :is(.v2-marca span, .v2-nav a span) { display: inline; }
  .v2-nav { flex-direction: row; }
  .v2-nav a, html.v2-rec .v2-nav a { padding: 8px 11px; border-left: 0; border-bottom: 2px solid transparent; gap: 7px; }
  .v2-nav a.on { border-bottom-color: var(--text); }
}
@media print { .v2-lado, .v2-faixa { display: none; } body, html.v2-rec body { padding-left: 0; padding-bottom: 0; } }
</style>

  </div>

  <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 2.500h10v11H3zM5.500 5.500h5M5.500 8h5M5.500 10.500h3"/></svg>
  <b id="v2-faixa-rot">Leitura:</b><span id="v2-faixa-txt">Estudo pessoal, não é recomendação de investimento.</span>
</div>
<script>
// Menu lateral: marca a página atual, lembra se está recolhido e, fora do htmlpreview (servidor local), troca os links por relativos.
(() => {
  const d = document, raiz = d.documentElement, botao = d.getElementById("v2-recolher");
  const marca = on => { raiz.classList.toggle("v2-rec", on); botao.setAttribute("aria-expanded", String(!on)); };
  try { marca(localStorage.getItem("v2-menu") === "recolhido"); } catch (e) {}
  botao.addEventListener("click", () => {
    const on = !raiz.classList.contains("v2-rec"); marca(on);
    try { localStorage.setItem("v2-menu", on ? "recolhido" : "aberto"); } catch (e) {}
  });
  const previa = location.hostname === "htmlpreview.github.io";
  const onde = decodeURIComponent(previa ? location.search : location.pathname).replace(/\/$/, "/index.html");
  const links = [...d.querySelectorAll("#v2-lado a[data-rel]")];
  const base = (onde.match(/^(.*\/)(?:index\.html|(?:resultados|resultados_ao_vivo|leituras|carteira)\/.*)$/) || [])[1];
  if (!previa && base != null) links.forEach(a => { a.href = base + a.dataset.rel; });
  const itens = links.filter(a => !a.classList.contains("v2-marca"));
  const atual = itens.find(a => !a.dataset.rel.includes("#") && onde.endsWith("/" + a.dataset.rel))
    || itens.find(a => a.dataset.grupo && onde.includes("/" + a.dataset.grupo));
  if (atual) { atual.classList.add("on"); atual.setAttribute("aria-current", "page"); }

  // Faixa do rodapé: na página inicial, o Ibovespa dos últimos pregões; nos dashboards, o subtítulo (data e base da leitura).
  const esc = s => s.replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
  let feito = false;
  const faixa = () => {
    if (feito) return;
    const txt = d.getElementById("v2-faixa-txt"), rot = d.getElementById("v2-faixa-rot");
    const linhas = [...d.querySelectorAll("#leituras tbody tr")].filter(tr => tr.cells.length > 1);
    if (linhas.length) {
      rot.textContent = "Ibovespa por pregão:";
      txt.innerHTML = linhas.slice(-12).reverse().map(tr => {
        const v = tr.cells[1].textContent.trim();
        return `${esc(tr.cells[0].textContent.trim())} <span class="${/^[−-]/.test(v) ? "neg" : "pos"}">${esc(v)}</span>`;
      }).join("<i>•</i>");
      feito = true; return;
    }
    const sub = d.querySelector("header .sub, .wrap .sub");
    const t = sub && sub.textContent.replace(/\s+/g, " ").trim();
    if (t) { txt.innerHTML = esc(t) + "<i>•</i>Estudo pessoal, não é recomendação de investimento."; feito = true; }
  };
  d.addEventListener("DOMContentLoaded", faixa); addEventListener("load", faixa); setTimeout(faixa, 1500);
})();
</script>
